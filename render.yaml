# Render Blueprint — https://render.com/docs/blueprint-spec
# Dashboard → New → Blueprint → chọn repo này → Apply.
#
# QUAN TRỌNG: service Express cũ tên "ims-api" (trả "Home Page") KHÔNG phải API .NET.
# Blueprint tạo service Docker mới: ims-backend. Xóa hoặc bỏ qua ims-api (Express).

databases:
  - name: ims-db
    plan: free
    region: oregon
    databaseName: ims_db
    user: ims
    postgresMajorVersion: "15"

services:
  - type: web
    name: ims-backend
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./Backend/IMSBackend/Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DATABASE_URL
        fromDatabase:
          name: ims-db
          property: connectionString
      - key: Jwt__Key
        generateValue: true
      - key: Cors__Origins
        value: https://ttnndeve.onrender.com,http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173

  # Frontend = Static Site (KHÔNG dùng Web Service Node + yarn start)
  - type: web
    name: ttnndeve
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # URL API .NET thật (không dùng ims-backend Express / ims-api cũ)
      - key: VITE_API_BASE_URL
        value: https://ims-api-ftzr.onrender.com/api
