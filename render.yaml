# Render Blueprint — https://render.com/docs/blueprint-spec
# Dashboard → New → Blueprint → chọn repo này → Apply.
# Sau khi tạo xong, copy URL thật và cập nhật env (bước trong README).

databases:
  - name: ims-db
    plan: free
    region: oregon
    databaseName: ims_db
    user: ims
    postgresMajorVersion: "15"

services:
  - type: web
    name: ims-api
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./Backend/IMSBackend/Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DATABASE_URL
        fromDatabase:
          name: ims-db
          property: connectionString
      - key: Jwt__Key
        generateValue: true
      # Đổi thành URL Static Site thật sau khi Blueprint tạo xong, rồi redeploy API
      - key: Cors__Origins
        value: https://ttnndeve.onrender.com

  # Frontend = Static Site (KHÔNG dùng Web Service Node + yarn start)
  - type: web
    name: ttnndeve
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Đổi thành URL API thật (https://ims-api-xxxx.onrender.com/api), rồi Manual Deploy lại Static
      - key: VITE_API_BASE_URL
        value: https://ims-api.onrender.com/api
