# Render Blueprint — https://render.com/docs/blueprint-spec
# Sau khi tạo service, cập nhật URL thật vào Dashboard nếu khác mặc định.

databases:
  - name: ims-db
    plan: free
    databaseName: ims_db
    user: ims

services:
  # ASP.NET Core API
  - type: web
    name: ims-api
    runtime: docker
    dockerfilePath: ./Backend/IMSBackend/Dockerfile
    # Repo root — must match COPY paths in Dockerfile (Backend/IMSBackend/...)
    dockerContext: .
    plan: free
    healthCheckPath: /
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DATABASE_URL
        fromDatabase:
          name: ims-db
          property: connectionString
      - key: Jwt__Key
        generateValue: true
      # Đổi thành URL Static Site thật sau khi deploy (Dashboard → Environment)
      - key: Cors__Origins
        value: https://ttnndeve.onrender.com

  # Vue static site (Static Sites không dùng plan: free)
  - type: web
    name: ttnndeve
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Đổi thành URL API thật sau khi deploy (Dashboard → Environment), rồi Redeploy
      - key: VITE_API_BASE_URL
        value: https://ims-api.onrender.com/api
