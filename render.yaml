# Render Blueprint — https://render.com/docs/blueprint-spec
# Sau khi tạo service, cập nhật URL thật vào env (xem README / checklist).

databases:
  - name: ims-db
    plan: free
    databaseName: ims_db
    user: ims

services:
  # ASP.NET Core API
  - type: web
    name: ims-api
    runtime: docker
    dockerfilePath: ./Backend/IMSBackend/Dockerfile
    dockerContext: ./Backend/IMSBackend
    plan: free
    healthCheckPath: /
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DATABASE_URL
        fromDatabase:
          name: ims-db
          property: connectionString
      - key: Jwt__Key
        generateValue: true
      # TODO: đổi thành URL Static Site thật sau khi deploy frontend
      - key: Cors__Origins
        sync: false
        value: https://ttnndeve.onrender.com

  # Vue static site
  - type: web
    name: ttnndeve
    runtime: static
    plan: free
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # TODO: đổi thành URL API thật (thường https://ims-api.onrender.com/api)
      - key: VITE_API_BASE_URL
        sync: false
        value: https://ims-api.onrender.com/api
